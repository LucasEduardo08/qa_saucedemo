[project]
name = "saucedemo"
version = "0.1.0"
description = ""
authors = [
    {name = "Lucas Eduardo",email = "lept.eng21@uea.edu.br"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "playwright (>=1.62.0,<2.0.0)",
    "pytest-playwright (>=0.8.0,<0.9.0)"
]

[tool.poetry]
packages = [{include = "saucedemo", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
